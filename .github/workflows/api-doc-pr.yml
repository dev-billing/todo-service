on:
  pull_request:
    types: [closed]
    branches:
      - develop
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dooray í¸ì¶ ìì´ ë¯¸ë¦¬ë³´ê¸°ë§"
        required: false
        type: boolean
        default: false

concurrency:
  group: api-docs-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync-on-merge:
    name: Sync docs/*.md to Dooray (on merge)
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    uses: dev-billing/shared-workflows/.github/workflows/reusable-sync-docs-to-dooray.yml@main
    with:
      repo_name: ${{ github.repository }}
      dry_run: false
    secrets: inherit

  sync-manual:
    name: Sync docs/*.md to Dooray (manual)
    if: github.event_name == 'workflow_dispatch'
    uses: dev-billing/shared-workflows/.github/workflows/reusable-sync-docs-to-dooray.yml@main
    with:
      repo_name: ${{ github.repository }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
